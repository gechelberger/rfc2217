[package]
name = "rfc2217-cli"
description = "RFC 2217 (Telnet COM Port Control) on the command line: a serial terminal for remote ports and a local pty bridge"
keywords = ["rfc2217", "serial", "telnet", "ser2net", "pty"]
categories = ["command-line-utilities", "hardware-support"]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Greg Echelberger <gechelberger@gmail.com>"]
repository = "https://github.com/gechelberger/rfc2217"
readme = "README.md"
# Not on crates.io yet: the first release is published by hand (see
# CHANGELOG.md), after which release-cli.yml takes over.
publish = false

# Its own workspace, like ci/fw-stub: it is not a member of rfc2217's, so the
# library's lockfile, feature unification and CI never see the CLI.
[workspace]

[[bin]]
name = "rfc2217"
path = "src/main.rs"
# The binary shares its name with the library: documenting both would write
# to the same target/doc/rfc2217 directory.
doc = false

[dependencies]
rfc2217 = { version = "0.1.0", path = "..", features = ["tracing"] }
clap = { version = "4.5", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "std", "ansi"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["termios", "pty", "fs", "process", "stdio", "event"] }
signal-hook = "0.4"

# The library's lints, minus the rustdoc ones (the binary has no docs).
[lints.rust]
# A local `#[allow(unsafe_code)]` with a comment covers the few ioctls that
# rustix does not wrap.
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

# The pty harness of tests/connect_tty.rs. Also a normal dependency, with the
# same version: listed here so that the tests keep the features they use.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["fs", "process", "pty", "stdio", "termios"] }
