# Release checks for rfc2217: tests on stable and the MSRV, lints, docs, the
# no_std builds (including a firmware stub that must link without a global
# allocator), minimal dependency versions and packaging.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update
      # Edition 2024 implies resolver 3, which picks dependency versions whose
      # rust-version is at most 1.85. If a newer cargo rewrote Cargo.lock in a
      # format 1.85 cannot read, regenerate it with `cargo +1.85 generate-lockfile`.
      - run: cargo +1.85 test
      - run: cargo +1.85 test --all-features
      - run: cargo +1.85 test --no-default-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo fmt --check
      # The firmware stub is a workspace of its own: the root checks skip it.
      - run: cargo fmt --check --manifest-path ci/fw-stub/Cargo.toml

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: cargo doc --no-deps --all-features
      - run: cargo doc --no-deps --no-default-features

  # docs.rs builds with nightly, all features and `--cfg docsrs` (see
  # `[package.metadata.docs.rs]`); a failure there only shows after publishing.
  docs-rs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg docsrs
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal --no-self-update
      - run: cargo +nightly doc --no-deps --all-features

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: rustup target add thumbv6m-none-eabi
      - run: cargo build --lib --target thumbv6m-none-eabi --no-default-features
      # Default features: the library builds (a binary would need a global allocator).
      - run: cargo build --lib --target thumbv6m-none-eabi
      # A no_main binary using only the core, with `default-features = false`:
      # it must link without a `#[global_allocator]`.
      - run: cargo build --release --target thumbv6m-none-eabi --manifest-path ci/fw-stub/Cargo.toml

  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly 1.85 --profile minimal --no-self-update
      # Rewrites Cargo.lock with the lowest versions Cargo.toml allows for the
      # direct dependencies (tracing 0.1.40); the checkout is thrown away after.
      - run: cargo +nightly update -Z direct-minimal-versions
      - run: cargo +1.85 test --all-features

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: cargo publish --dry-run
      - name: package excludes CI files and build output
        run: |
          list="$(cargo package --list)"
          printf '%s\n' "$list"
          if printf '%s\n' "$list" | grep -E '^(\.github|ci|target)/'; then
            echo "::error::the package contains .github/, ci/ or target/ entries"
            exit 1
          fi
