# Release checks for rfc2217: tests on stable and the MSRV, lints, docs, the
# no_std builds (including a firmware stub that must link without a global
# allocator), minimal dependency versions and packaging.
#
# Each check job runs one recipe of the justfile at the repository root, so
# `just <recipe>` runs the same commands locally. The jobs add the toolchains
# and `just` itself; the package job keeps its commands here, since its file
# check reports through GitHub annotations.
name: CI

on:
  push:
  pull_request:
  # release.yml runs every job here on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `just` from its release, checked against the hash in the action's
      # manifest; never built or fetched any other way (fallback: none).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
          fallback: none
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: just test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `just` from its release, checked against the hash in the action's
      # manifest; never built or fetched any other way (fallback: none).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
          fallback: none
      - run: rustup toolchain install 1.85 --profile minimal --no-self-update
      # Edition 2024 implies resolver 3, which picks dependency versions whose
      # rust-version is at most 1.85. If a newer cargo rewrote Cargo.lock in a
      # format 1.85 cannot read, regenerate it with `cargo +1.85 generate-lockfile`.
      - run: just msrv

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `just` from its release, checked against the hash in the action's
      # manifest; never built or fetched any other way (fallback: none).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
          fallback: none
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable
      # Also the format check of the firmware stub, a workspace of its own
      # that the root checks skip.
      - run: just lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `just` from its release, checked against the hash in the action's
      # manifest; never built or fetched any other way (fallback: none).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
          fallback: none
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      # With RUSTDOCFLAGS=-D warnings (set by the recipe).
      - run: just docs

  # docs.rs builds with nightly, all features and `--cfg docsrs` (see
  # `[package.metadata.docs.rs]`); a failure there only shows after publishing.
  docs-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `just` from its release, checked against the hash in the action's
      # manifest; never built or fetched any other way (fallback: none).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
          fallback: none
      - run: rustup toolchain install nightly --profile minimal --no-self-update
      # With RUSTDOCFLAGS=--cfg docsrs (set by the recipe).
      - run: just docs-rs

  no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `just` from its release, checked against the hash in the action's
      # manifest; never built or fetched any other way (fallback: none).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
          fallback: none
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      # The recipe adds the thumbv6m-none-eabi target, then builds the core
      # without default features, the library with them (a binary would need
      # a global allocator), and a no_main firmware stub using only the core
      # (`default-features = false`), which must link without a
      # `#[global_allocator]`.
      - run: just no-std

  minimal-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `just` from its release, checked against the hash in the action's
      # manifest; never built or fetched any other way (fallback: none).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
          fallback: none
      - run: rustup toolchain install nightly 1.85 --profile minimal --no-self-update
      # Tests on 1.85 after rewriting Cargo.lock with the lowest versions
      # Cargo.toml allows for the direct dependencies (tracing 0.1.40); the
      # recipe puts the lockfile back afterwards.
      - run: just minimal-versions

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: cargo publish --dry-run
      - name: package excludes CI files and build output
        run: |
          list="$(cargo package --list)"
          printf '%s\n' "$list"
          if printf '%s\n' "$list" | grep -E '^(\.github|ci|target)/'; then
            echo "::error::the package contains .github/, ci/ or target/ entries"
            exit 1
          fi
